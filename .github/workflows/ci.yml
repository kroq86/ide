name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ignore-scripts: terminal-react-core must not build during install (tsup/rollup).
      # Lockfile lists platform rollup binaries; rm node_modules so npm ci resolves
      # the correct optional native module for this runner (not a stale macOS tree).
      - run: rm -rf node_modules
      - run: npm ci --ignore-scripts
      - run: npm run build:terminal-core

      - run: npm run typecheck

      - name: Unit tests
        run: npm --workspace qe-react-editor-app run test
        env:
          AI_PROVIDER: none
