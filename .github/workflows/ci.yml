name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ignore-scripts: terminal-react-core must not build during ci (rollup native
      # optional deps are platform-specific; lockfile may come from macOS).
      - run: npm ci --ignore-scripts
      - run: npm install --no-audit --no-fund
      - run: npm run build:terminal-core

      - run: npm run typecheck

      - name: Unit tests
        run: npm --workspace qe-react-editor-app run test
        env:
          AI_PROVIDER: none
