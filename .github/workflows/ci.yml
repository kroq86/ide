name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Do not use npm ci: lockfile is generated on macOS and omits Linux optional
      # native packages (@esbuild/linux-x64, @rollup/rollup-linux-x64-gnu, etc.).
      # npm install resolves platform optionals for the current runner.
      - run: rm -rf node_modules
      - run: npm install --no-audit --no-fund
      - run: npm run build:terminal-core

      - run: npm run typecheck

      - name: Unit tests
        run: npm --workspace qe-react-editor-app run test
        env:
          AI_PROVIDER: none
