name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - run: npm run build

      - name: Package tarball
        run: node scripts/package.mjs ${{ github.ref_name }} ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: qe-${{ github.ref_name }}-${{ matrix.platform }}
          path: qe-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
