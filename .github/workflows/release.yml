name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-14
            platform: darwin-x86_64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - run: rm -rf node_modules
      - run: npm install --no-audit --no-fund
      - run: npm run build:terminal-core

      - name: Build JS bundle
        run: npm --workspace qe-react-editor-app run build

      - name: Build native binary
        run: cargo build --release --target ${{ matrix.rust_target }}
        working-directory: native/editor-core

      - name: Stage native binary for packaging
        run: |
          mkdir -p native/editor-core/target/release
          cp native/editor-core/target/${{ matrix.rust_target }}/release/editor-core \
             native/editor-core/target/release/editor-core

      - name: Package tarball
        run: node scripts/package.mjs ${{ github.ref_name }} ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: qe-${{ github.ref_name }}-${{ matrix.platform }}
          path: qe-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: qe-${{ github.ref_name }}-linux-x86_64
          path: tarballs

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev apt-utils fakeroot

      - name: Build .deb
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TARBALL="tarballs/qe-${{ github.ref_name }}-linux-x86_64.tar.gz"
          PKG="qe_${VERSION}_amd64"

          tar -xzf "$TARBALL"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/qe"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: qe
          Version: $VERSION
          Architecture: amd64
          Maintainer: KO <djkroq@gmail.com>
          Depends: nodejs (>= 22)
          Description: Terminal editor with Vim keybindings, Git, LSP, and AI support
          EOF

          cp -R "qe-${{ github.ref_name }}-linux-x86_64/libexec/." "$PKG/usr/lib/qe/"
          chmod 755 "$PKG/usr/lib/qe/editor-core"

          printf '#!/bin/sh\nexec node /usr/lib/qe/main.js "$@"\n' > "$PKG/usr/bin/qe"
          chmod 755 "$PKG/usr/bin/qe"

          fakeroot dpkg-deb --build "$PKG" "qe_${VERSION}_amd64.deb"

      - name: Publish to apt repository on gh-pages
        env:
          APT_GPG_SECRET_KEY: ${{ secrets.APT_GPG_SECRET_KEY }}
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DEB="qe_${VERSION}_amd64.deb"

          # Import signing key (skip signing if secret not set)
          SIGN_ARGS=""
          if [ -n "$APT_GPG_SECRET_KEY" ]; then
            echo "$APT_GPG_SECRET_KEY" | gpg --batch --import
            KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
            SIGN_ARGS="-o Release.gpg --default-key $KEY_ID --armor --detach-sign"
          fi

          POOL="gh-pages/pool/main"
          DISTS="gh-pages/dists/stable/main/binary-amd64"
          mkdir -p "$POOL" "$DISTS"
          cp "$DEB" "$POOL/"

          # Build Packages index
          (cd gh-pages && dpkg-scanpackages --multiversion pool/main /dev/null > dists/stable/main/binary-amd64/Packages)
          gzip -kf gh-pages/dists/stable/main/binary-amd64/Packages

          # Build Release
          (cd gh-pages/dists/stable && apt-ftparchive release . > Release)
          if [ -n "$SIGN_ARGS" ]; then
            gpg $SIGN_ARGS gh-pages/dists/stable/Release
          fi

          # Commit and push gh-pages
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: publish qe ${{ github.ref_name }}"
          git push origin gh-pages

  publish-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute sha256 values
        id: sha
        run: |
          ARM64="$(sha256sum qe-${{ github.ref_name }}-darwin-arm64.tar.gz | awk '{print $1}')"
          X86="$(sha256sum qe-${{ github.ref_name }}-darwin-x86_64.tar.gz | awk '{print $1}')"
          LINUX="$(sha256sum qe-${{ github.ref_name }}-linux-x86_64.tar.gz | awk '{print $1}')"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "x86=$X86" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX" >> "$GITHUB_OUTPUT"

      - name: Update homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kroq86/homebrew-qe.git" tap
          mkdir -p tap/Formula

          sed \
            -e "s/PLACEHOLDER_darwin_arm64/${{ steps.sha.outputs.arm64 }}/g" \
            -e "s/PLACEHOLDER_darwin_x86_64/${{ steps.sha.outputs.x86 }}/g" \
            -e "s/PLACEHOLDER_linux_x86_64/${{ steps.sha.outputs.linux }}/g" \
            -e "s/version \"[0-9][0-9.]*\"/version \"$VERSION\"/g" \
            docs/homebrew-formula.rb > tap/Formula/qe.rb  || \
          { echo "Formula template missing — skipping homebrew update"; exit 0; }

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/qe.rb
          git diff --cached --quiet && echo "No formula changes" && exit 0
          git commit -m "qe ${{ github.ref_name }}"
          git push origin main
